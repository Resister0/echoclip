# Echo's release build in the PUBLIC repo (github.com/Resister0/echoclip): every file people download or
# auto-update to is built here from the public source, so anyone can check what went into it (also needed
# for free code signing via SignPath later). This file lives in the private repo as ci/public-build.yml and is
# copied to .github/workflows/build.yml here on every publish. Needs the secret TAURI_SIGNING_PRIVATE_KEY
# (same value as in the private repo) for auto-update signatures.
name: Build Echo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# one publish at a time: two runs side by side both delete + re-create the "latest" release and the last one to
# finish wins (chat 31: "# AppImage update info" overtook "Light themes" and 1.0.68 was never offered). Queued, not cancelled.
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'Resister0/echoclip'
    runs-on: windows-latest
    env:
      # Echo's Google Drive login (read by src-tauri/build.rs; not in the code - chat 29)
      ECHO_GDRIVE_SECRET: ${{ secrets.ECHO_GDRIVE_SECRET }}
      # Certum code signing (9 Nov 2026): only WHETHER it's set up - the secrets themselves go to the signing step
      # alone, never into the job (build scripts of dependencies must not be able to read them)
      HAS_CERTUM: ${{ secrets.CERTUM_TOTP_SECRET != '' && secrets.CERTUM_USERNAME != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            prototype-native
      - name: Version
        # same number as the private repo's build (ci/version.txt, written when the code is copied here)
        # Own builds (build.cmd / build.sh) stay 0.1.0 and never offer updates.
        # tauri.conf.json: only the installer packer reads it (version, update key) - no Tauri app is built any more
        shell: bash
        run: |
          V=$(cat ci/version.txt 2>/dev/null | tr -d ' \r\n'); [ -n "$V" ] || V="1.0.0"
          sed -i 's/"version": "0.1.0"/"version": "'"$V"'"/' src-tauri/tauri.conf.json
          echo "ECHO_VERSION=$V" >> "$GITHUB_ENV"
          grep '"version"' src-tauri/tauri.conf.json
      - name: Native app
        # 10 Nov 2026 (William): Echo 2.0 = the native app ONLY (prototype-native: Slint + mpv, Echo's recorder via
        # echo-core). The old Tauri app is no longer built and there is no fallback to it: if this fails, the run fails.
        # EchoClip.exe, not Echo.exe (chat 31): Discord's own game detection showed "Playing ECHO" (a 2017 game) for Echo.exe.
        # The Installer step packs it with Tauri's NSIS bundler (a packing tool only - `tauri bundle` builds nothing),
        # so the install folder, uninstaller, hooks.nsh and the /P /R /UPDATE handling are exactly what 1.0.x's updater
        # expects (tested on William's PC: update over 1.0.71 installed + relaunched it).
        # libmpv-2.dll = shinchiro's mpv build 20261107 (git 9028187538), pinned + fingerprint: byte-identical to the
        # DLL tested on William's PC. ECHO_VERSION (Version step) goes into the exe: its updater + version details.
        shell: bash
        run: |
          mkdir -p dl
          curl -fsSL --retry 3 -o dl/mpv.7z https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261107/mpv-dev-x86_64-20261107-git-9028187538.7z
          echo "df7c433a2d481fdaf6163b201f26abbb0eff0c215c51368397088c6d8f7a001b  dl/mpv.7z" | sha256sum -c -
          7z e -y -odl dl/mpv.7z libmpv-2.dll
          echo "c91949577ae9cc2d500208da51f2c4a24cfa7a02d0ce6e130bf67ec738b450bb  dl/libmpv-2.dll" | sha256sum -c -
          cp dl/libmpv-2.dll src-tauri/libmpv-2.dll
          (cd prototype-native && cargo build --release)
          mkdir -p src-tauri/target/release
          cp prototype-native/target/release/echo-native-proto.exe src-tauri/target/release/EchoClip.exe
          ls -la src-tauri/target/release/EchoClip.exe src-tauri/libmpv-2.dll
      - name: Code signing login (Certum)
        # Certum "Open Source Code Signing in the Cloud" (Open Source Developer, William Albrektsen): logs SimplySign
        # Desktop in on this runner with the TOTP secret behind the SimplySign phone codes, then Windows sees the
        # certificate like a smart card and signtool can use it. Action reviewed 9 Nov 2026 (its only download is
        # SimplySign Desktop from files.certum.eu; the secret is masked, never printed) - pinned to that commit.
        # Secrets in THIS repo: CERTUM_USERNAME (Certum account email) + CERTUM_TOTP_SECRET (Base32). Not set = unsigned
        # build like before. A failed login doesn't stop the release (unsigned then, with a warning).
        id: certum
        if: env.HAS_CERTUM == 'true'
        continue-on-error: true
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
      - name: Installer
        # Echo-Setup.exe: installs for the current user (no admin), Start menu entry + uninstaller; then the portable zip
        # (no continue-on-error: a release without Windows files must not go out)
        shell: bash
        working-directory: src-tauri
        env:
          # signs the update (Echo only installs updates signed with this key; public half is in tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Certum (step above): Tauri signs EchoClip.exe, the uninstaller and Echo-Setup.exe itself with it - before
          # the update signature (.sig) is made, so that covers the signed file
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
          CERT_SHA1: ${{ steps.certum.outputs.cert-thumbprint }}
        run: |
          # the installer's first page shows which Echo it installs (William, 10 Nov 2026): "Echo 2.0.0 - ..."
          V=$(cat ../ci/version.txt 2>/dev/null | tr -d ' \r\n')
          [ -n "$V" ] && sed -i "1s/^Echo /Echo $V /" windows/installer-notice.txt && head -n 1 windows/installer-notice.txt
          UPD=""; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && UPD=',"createUpdaterArtifacts":true'
          SIGN=""
          if [ -n "$SIGNTOOL" ] && [ -n "$CERT_SHA1" ]; then
            # forward slashes: nothing to escape in JSON, and Windows takes them in paths (sed mangled the backslashes
            # in Git Bash)
            ST=$(printf '%s' "$SIGNTOOL" | tr '\\\\' '/')
            # goes right after "windows":{ in the --config JSON below (hence the comma at the END)
            SIGN='"signCommand":{"cmd":"'"$ST"'","args":["sign","/sha1","'"$CERT_SHA1"'","/tr","http://time.certum.pl","/td","SHA256","/fd","SHA256","%1"]},'
            echo "Signing with Certum certificate $CERT_SHA1"
          else
            echo "::warning::Not code-signed (Certum secrets not set or the login failed)"
          fi
          # ffmpeg + ffprobe + rclone go inside the installer (tools/ next to EchoClip.exe)
          # ffmpeg 9.0.2, NOT 8.0: with 8.0 every audio track came out empty on a friend's PC (chat 18)
          mkdir -p tools dl
          # pinned versions + fingerprints (chat 28): what goes into the (signed) installer is exactly these files
          curl -fsSL --retry 3 -o dl/ff.zip https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
          curl -fsSL --retry 3 -o dl/rc.zip https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-windows-amd64.zip
          echo "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba  dl/ff.zip" | sha256sum -c -
          echo "8a9db2bad1dc79a65b3348fd857069598e2aab7cf4d118b77b1df23055aff818  dl/rc.zip" | sha256sum -c -
          (cd dl && unzip -q ff.zip && unzip -q rc.zip)
          cp dl/*/bin/ffmpeg.exe dl/*/bin/ffprobe.exe tools/
          cp dl/rclone-*/rclone.exe tools/
          ls -la tools
          test -f target/release/EchoClip.exe && test -f libmpv-2.dll
          # bundle (not build): packs the native EchoClip.exe the Native app step put in target/release, + libmpv-2.dll;
          # no WebView2 install (the native app doesn't use it)
          npx --yes @tauri-apps/cli@2 bundle --bundles nsis \
            --config '{"mainBinaryName":"EchoClip","bundle":{"active":true'"$UPD"',"licenseFile":"windows/installer-notice.txt","resources":{"tools/*":"tools/","libmpv-2.dll":"libmpv-2.dll"},"windows":{'"$SIGN"'"webviewInstallMode":{"type":"skip"},"nsis":{"installMode":"currentUser","installerHooks":"windows/hooks.nsh","installerIcon":"icons/icon.ico","headerImage":"windows/header.bmp","sidebarImage":"windows/sidebar.bmp"}}}}'
          cp target/release/bundle/nsis/*-setup.exe ../Echo-Setup.exe
          cp target/release/bundle/nsis/*-setup.exe.sig ../Echo-Setup.exe.sig || echo "no update signature (secret TAURI_SIGNING_PRIVATE_KEY missing)"
          # the portable download (10 Nov 2026): the native app needs libmpv-2.dll (video player) next to it and its
          # tools/ (ffmpeg, ffprobe, rclone) like the installed copy - one zip: unpack anywhere, run EchoClip.exe
          rm -rf portable && mkdir -p portable/Echo
          cp target/release/EchoClip.exe libmpv-2.dll portable/Echo/
          cp -r tools portable/Echo/
          if [ -n "$SIGN" ]; then
            # MSYS_NO_PATHCONV: Git Bash turned signtool's /fd, /pa ... into paths ("File not found: C:/Program
            # Files/Git/pa", run #50) - the portable exe stayed unsigned and verify failed although the setup IS signed
            MSYS_NO_PATHCONV=1 "$ST" sign /sha1 "$CERT_SHA1" /tr http://time.certum.pl /td SHA256 /fd SHA256 portable/Echo/EchoClip.exe || echo "::warning::portable EchoClip.exe not signed"
            MSYS_NO_PATHCONV=1 "$ST" verify /pa ../Echo-Setup.exe || echo "::warning::Echo-Setup.exe signature doesn't verify"
          fi
          (cd portable && 7z a -tzip -mx=7 ../../Echo-Windows-portable.zip Echo >/dev/null)
          ls -la ../Echo-Setup.exe ../Echo-Windows-portable.zip
      - name: Code signing logout
        if: always() && steps.certum.outcome == 'success'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            Echo-Windows-portable.zip
            Echo-Setup.exe
            Echo-Setup.exe.sig
          if-no-files-found: warn

  linux:
    if: github.repository == 'Resister0/echoclip'
    # Ubuntu 22.04 = older system libraries, so the build also runs on newer distros (Fedora / Nobara, Arch, Ubuntu 24…)
    runs-on: ubuntu-22.04
    env:
      ECHO_GDRIVE_SECRET: ${{ secrets.ECHO_GDRIVE_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries
        # a slow Ubuntu mirror once hung here for 40+ minutes (chat 21): give up a stuck download after 30 s
        # and retry it, and stop the step after 30 min (15 wasn't enough on 6 Nov: the Azure Ubuntu mirror crawled, 1.0.60 had no Linux build)
        timeout-minutes: 30
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          # 10 Nov 2026: the native app only (WebKit, libsoup and the GStreamer players were the old Tauri app's).
          # Slint links fontconfig (+ xkbcommon), echo-core links D-Bus + ALSA; a few GTK crates are still in the lock.
          # libmpv-dev = libmpv.so.1 (mpv 0.34) + its libraries, bundled into the AppImage.
          sudo apt-get $APT install -y libgtk-3-dev librsvg2-dev libasound2-dev libdbus-1-dev libayatana-appindicator3-dev pkg-config \
            libfuse2 file patchelf zsync libfontconfig1-dev libxkbcommon-dev libmpv-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            prototype-native
      - name: Version
        # same number as the private repo's build (ci/version.txt, written when the code is copied here)
        # Own builds (build.cmd / build.sh) stay 0.1.0 and never offer updates.
        shell: bash
        run: |
          V=$(cat ci/version.txt 2>/dev/null | tr -d ' \r\n'); [ -n "$V" ] || V="1.0.0"
          echo "ECHO_VERSION=$V" >> "$GITHUB_ENV"
          echo "version $V"
      - name: Native app
        # 10 Nov 2026 (2.0.0, William): the Linux downloads ship the native Echo ONLY (prototype-native: Slint + mpv,
        # Echo's recorder via echo-core) as echo-clips, like Windows. ECHO_VERSION (Version step) goes into the binary:
        # its updater + version details. No fallback to the old Tauri app: if this fails, the run fails.
        id: native
        working-directory: prototype-native
        run: |
          cargo build --release
          ls -la target/release/echo-native-proto
          ldd target/release/echo-native-proto
      # whisper-cli for captions in the AppImage / plain Linux build (Fedora's whisper-cpp package has no command-line
      # tool). Built once per whisper version (cached), uploaded as a release file; Echo downloads it on first use and
      # checks GitHub's SHA-256 of it. Same version as the Flatpak module (flatpak/link.echoclip.Echo.yml). (chat 28)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: whisper-bin
          key: whisper-cli-v1.9.5-d1be6fde-static1
      - name: whisper-cli (captions)
        run: |
          if [ ! -x whisper-bin/whisper-cli ]; then
            git clone -q --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git /tmp/wcpp
            test "$(git -C /tmp/wcpp rev-parse HEAD)" = d1be6fde11ac6e0407606b4e42fe72d34add8037
            cmake -S /tmp/wcpp -B /tmp/wcpp/b -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
            cmake --build /tmp/wcpp/b -j "$(nproc)" --target whisper-cli
            mkdir -p whisper-bin && cp /tmp/wcpp/b/bin/whisper-cli whisper-bin/
          fi
          cp whisper-bin/whisper-cli whisper-cli-x86_64-linux
          out=$(./whisper-cli-x86_64-linux --help 2>&1 || true); echo "$out" | grep -qi usage || { echo "whisper-cli doesn't start: $out"; exit 1; }
          ldd whisper-cli-x86_64-linux
      - name: Package
        run: |
          mkdir -p Echo-linux
          cp build.sh src-tauri/icons/icon.png Echo-linux/
          # the plain binary: libmpv (video player) comes from the distro here - only the AppImage has it inside
          cp prototype-native/target/release/echo-native-proto Echo-linux/Echo
          cat > Echo-linux/README.txt <<'TXT'
          Echo for Linux (x86_64)
          Start: ./Echo
          Needs (Fedora / Nobara): sudo dnf install mpv-libs gpu-screen-recorder ffmpeg-free wl-clipboard libnotify pulseaudio-utils
          Ubuntu / Debian: sudo apt install libmpv2 ffmpeg wl-clipboard libnotify-bin pulseaudio-utils (Ubuntu 22.04 / Debian 11: libmpv1 instead of libmpv2) (+ gpu-screen-recorder from its website / flatpak)
          Arch: sudo pacman -S mpv ffmpeg wl-clipboard libnotify libpulse (+ gpu-screen-recorder from the AUR)
          mpv-libs / libmpv = the video player library. Without it Echo records fine but can't play clips.
          Don't want to install anything? Echo-x86_64.AppImage has the video player inside.
          TXT
          tar -czf Echo-linux-x86_64.tar.gz Echo-linux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: AppImage (native app)
        # one file that runs on most distros: echo-clips + libmpv (Ubuntu 22.04's mpv 0.34 = libmpv.so.1) and the
        # libraries it needs, gathered by linuxdeploy. The recorder tools (gpu-screen-recorder, ffmpeg) still come from
        # the system. A system libmpv.so.2 (newer mpv) wins over the bundled .so.1 (prototype-native/src/mpv.rs).
        # People who auto-update from the old (Tauri) AppImage get this file - it must play clips without mpv installed.
        # Not bundled (the PC's own copies are used): libva (an older libva can't load newer VA-API drivers = no GPU
        # decoding), libwayland-* / libxkbcommon (Slint loads them too - same copies as the plain build), libdbus.
        # Plus linuxdeploy's own excludelist (glibc, libstdc++, GL/EGL, X11, ALSA, fontconfig...).
        # Built as Echo-native.AppImage + .sig and only renamed at the very end. No fallback to the old Tauri AppImage
        # (10 Nov 2026): if this fails, the run fails.
        id: appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
          INFO: gh-releases-zsync|Resister0|echoclip|latest|Echo-x86_64.AppImage.zsync
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          T=$RUNNER_TEMP/appimage; rm -rf "$T" AppDir Echo-native.AppImage*; mkdir -p "$T/stage"
          # linuxdeploy pinned + fingerprint; appimagetool = the same continuous build the update-info step uses
          curl -fsSL --retry 3 -o "$T/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $T/linuxdeploy" | sha256sum -c -
          curl -fsSL --retry 3 -o "$T/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$T/linuxdeploy" "$T/appimagetool"
          cp prototype-native/target/release/echo-native-proto "$T/stage/echo-clips"
          cp src-tauri/icons/icon.png "$T/stage/echo-clips.png"
          # StartupWMClass=echo: the native window's Wayland app_id / X11 class (prototype-native/src/popup.rs) -
          # KDE / GNOME find the icon through it (also in the copy AppImageLauncher / Gear Lever install)
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Echo' 'GenericName=Game Clip Recorder' \
            'Comment=Save game highlights with one key' 'Exec=echo-clips' 'Icon=echo-clips' 'Terminal=false' \
            'Categories=AudioVideo;Video;Recorder;' 'StartupWMClass=echo' 'SingleMainWindow=true' > "$T/stage/echo.desktop"
          MPV=/usr/lib/x86_64-linux-gnu/libmpv.so.1
          test -e "$MPV"
          "$T/linuxdeploy" --appdir AppDir -e "$T/stage/echo-clips" -d "$T/stage/echo.desktop" -i "$T/stage/echo-clips.png" \
            -l "$MPV" --exclude-library 'libva.so*' --exclude-library 'libva-*' --exclude-library 'libwayland-*' \
            --exclude-library 'libxkbcommon*' --exclude-library 'libdbus-1.so*'
          # mpv.rs looks for usr/lib/libmpv.so.1 by that exact name
          [ -e AppDir/usr/lib/libmpv.so.1 ] || ln -s "$(basename "$(readlink -f "$MPV")")" AppDir/usr/lib/libmpv.so.1
          readelf -d AppDir/usr/bin/echo-clips | grep -iE 'runpath|rpath' || true
          ls AppDir/usr/lib; du -sh AppDir
          # every library the bundled libmpv needs: in the AppDir, or one of the system ones left out on purpose
          if ldd AppDir/usr/lib/libmpv.so.1 | grep 'not found'; then echo "bundled libmpv misses libraries"; exit 1; fi
          ldd AppDir/usr/lib/libmpv.so.1 | grep -v "$PWD/AppDir" || true
          # the bundled libmpv really starts (load + create + initialize, no window / sound)
          python3 - "$PWD/AppDir/usr/lib/libmpv.so.1" <<'PY'
          import ctypes, sys
          m = ctypes.CDLL(sys.argv[1])
          v = m.mpv_client_api_version()
          m.mpv_create.restype = ctypes.c_void_p
          h = m.mpv_create()
          assert h, "mpv_create failed"
          for k, val in ((b"vo", b"null"), (b"ao", b"null")):
              m.mpv_set_option_string(ctypes.c_void_p(h), k, val)
          r = m.mpv_initialize(ctypes.c_void_p(h))
          assert r >= 0, "mpv_initialize: %d" % r
          m.mpv_terminate_destroy(ctypes.c_void_p(h))
          print("bundled libmpv OK, client API %d.%d" % (v >> 16, v & 0xffff))
          PY
          # pack with the update information inside (AppImageHub / AppImageUpdate; Echo itself updates via the .sig)
          ARCH=x86_64 "$T/appimagetool" --no-appstream -u "$INFO" AppDir Echo-native.AppImage
          chmod +x Echo-native.AppImage
          info=$(./Echo-native.AppImage --appimage-updateinformation)
          case "$info" in gh-releases-zsync*) echo "update information: $info" ;; *) echo "no update information: '$info'"; exit 1 ;; esac
          rm -f Echo-native.AppImage.zsync
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Echo's updater signature: the same minisign key + .sig format the Tauri bundler made (base64 of the
            # minisign signature) - prototype-native/src/setup.rs verify() and the old Tauri updater both check it
            npx --yes @tauri-apps/cli@2 signer sign Echo-native.AppImage
            test -s Echo-native.AppImage.sig
          else
            echo "no update signature (secret TAURI_SIGNING_PRIVATE_KEY missing)"
          fi
          # everything worked: swap in (the .zsync is made from this file by the next step)
          rm -f Echo-x86_64.AppImage Echo-x86_64.AppImage.sig
          mv Echo-native.AppImage Echo-x86_64.AppImage
          if [ -f Echo-native.AppImage.sig ]; then mv Echo-native.AppImage.sig Echo-x86_64.AppImage.sig; fi
          rm -rf AppDir
          ls -la Echo-x86_64.AppImage*
      - name: AppImage update info (.zsync)
        # Tauri's AppImage tooling ignores LDAI_UPDATE_INFORMATION, so the AppImage is re-packed here with appimagetool -u
        # (AppImageHub bot, chat 30). The native AppImage already has it (packed with -u): then this only makes the .zsync.
        # Built as Echo-new.AppImage, re-signed for Echo's own updater, and only then swapped in -
        # if anything fails, the original AppImage + .sig are released unchanged.
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          INFO: gh-releases-zsync|Resister0|echoclip|latest|Echo-x86_64.AppImage.zsync
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          [ -f Echo-x86_64.AppImage ] || { echo "no AppImage"; exit 0; }
          chmod +x Echo-x86_64.AppImage
          info=$(./Echo-x86_64.AppImage --appimage-updateinformation 2>/dev/null || true)
          echo "embedded update information: '$info'"
          case "$info" in
            gh-releases-zsync*) cp Echo-x86_64.AppImage Echo-new.AppImage ;;
            *)
              wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              rm -rf squashfs-root && ./Echo-x86_64.AppImage --appimage-extract >/dev/null
              ARCH=x86_64 ./appimagetool --no-appstream -u "$INFO" squashfs-root Echo-new.AppImage
              rm -rf squashfs-root
              chmod +x Echo-new.AppImage
              # the re-packed file must start and say where its updates are
              ./Echo-new.AppImage --appimage-updateinformation | grep -q '^gh-releases-zsync' ;;
          esac
          rm -f Echo-new.AppImage.zsync
          if [ "$info" = "${info#gh-releases-zsync}" ]; then
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              npx --yes @tauri-apps/cli@2 signer sign Echo-new.AppImage
              mv Echo-new.AppImage.sig Echo-x86_64.AppImage.sig
            fi
            mv Echo-new.AppImage Echo-x86_64.AppImage
          else
            rm -f Echo-new.AppImage
          fi
          # .zsync last, from the final file
          zsyncmake -u Echo-x86_64.AppImage -o Echo-x86_64.AppImage.zsync Echo-x86_64.AppImage
          ./Echo-x86_64.AppImage --appimage-updateinformation
          head -c 400 Echo-x86_64.AppImage.zsync | sed -n '1,8p'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            Echo-linux-x86_64.tar.gz
            Echo-x86_64.AppImage
            Echo-x86_64.AppImage.sig
            Echo-x86_64.AppImage.zsync
            whisper-cli-x86_64-linux
          if-no-files-found: warn

  flatpak:
    # Echo's own Flatpak repo (https://flatpak.echoclip.link, install link https://echoclip.link/download/flatpak):
    # builds flatpak/link.echoclip.Echo.yml from this code and adds it as a signed update (ci/flatpak-repo.sh).
    # Secrets: FLATPAK_GPG_KEY, R2_ACCOUNT_ID, R2_FLATPAK_ACCESS_KEY_ID, R2_FLATPAK_SECRET_ACCESS_KEY - not set = skipped.
    # Runs next to the other builds; if it fails, the normal release still goes out.
    if: github.repository == 'Resister0/echoclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: flatpak-repo
      cancel-in-progress: false
    env:
      FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_FLATPAK_ACCESS_KEY_ID: ${{ secrets.R2_FLATPAK_ACCESS_KEY_ID }}
      R2_FLATPAK_SECRET_ACCESS_KEY: ${{ secrets.R2_FLATPAK_SECRET_ACCESS_KEY }}
    steps:
      - name: Secrets set?
        id: ok
        run: |
          if [ -n "$FLATPAK_GPG_KEY" ] && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_FLATPAK_ACCESS_KEY_ID" ] && [ -n "$R2_FLATPAK_SECRET_ACCESS_KEY" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Flatpak repo skipped - secrets FLATPAK_GPG_KEY / R2_ACCOUNT_ID / R2_FLATPAK_ACCESS_KEY_ID / R2_FLATPAK_SECRET_ACCESS_KEY not set"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ok.outputs.go
      - name: Tools
        if: steps.ok.outputs.go
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y flatpak flatpak-builder elfutils appstream ostree gnupg unzip
          # rclone: the current release, not Ubuntu's 1.60 (that one got "NotImplemented 501" from R2 on the
          # first try of every upload, run #35)
          curl -fsSL --retry 5 -o /tmp/rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  /tmp/rclone.zip" | sha256sum -c -
          unzip -q -j /tmp/rclone.zip '*/rclone' -d /tmp/rclone && sudo install -m 755 /tmp/rclone/rclone /usr/local/bin/rclone
          rclone version | head -1
          # Ubuntu 24.04 blocks the user namespaces flatpak-builder's sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --version
      - name: Build cache
        # finished modules (ffmpeg, gpu-screen-recorder, whisper.cpp...) are reused until the manifest changes them
        if: steps.ok.outputs.go
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flatpak/state
          key: flatpak-${{ hashFiles('flatpak/*.yml', 'flatpak/cargo-sources.json') }}-${{ github.run_id }}
          restore-keys: flatpak-
      - name: Google Drive login for the build
        # the Flatpak builds from this folder (type: dir) without the job's environment: build.rs reads the file
        if: steps.ok.outputs.go
        env:
          S: ${{ secrets.ECHO_GDRIVE_SECRET }}
        run: '[ -z "$S" ] || printf %s "$S" > src-tauri/gdrive.secret.txt'
      - name: Build + update the repo
        if: steps.ok.outputs.go
        run: bash ci/flatpak-repo.sh

  release:
    # publishes whatever built (one OS failing doesn't block the other)
    needs: [windows, linux]
    if: always() && (needs.windows.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg=$(git log -1 --pretty=%s)
          files=$(find out -type f \( -name 'Echo-Windows-portable.zip' -o -name 'Echo-Setup.exe' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.sig' -o -name '*.zsync' -o -name 'whisper-cli-*' \))
          notes="Built from: $msg

          Windows: download Echo-Setup.exe (installs Echo with a Start menu entry) or Echo-Windows-portable.zip (no install: unzip it anywhere and run EchoClip.exe). First start: if Windows says it protected your PC, click More info > Run anyway.
          Linux: download Echo-x86_64.AppImage, make it runnable (right-click > Properties > Allow executing, or chmod +x) and start it. Also needs gpu-screen-recorder + ffmpeg from your distro.
          (Echo-linux-x86_64.tar.gz = the plain program, smaller; it also needs your distro's mpv library to play clips - Fedora/Nobara: mpv-libs, Ubuntu/Debian: libmpv2, Arch: mpv - see README.txt inside.)
          Windows build: ${{ needs.windows.result }} / Linux build: ${{ needs.linux.result }}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          V=$(cat ci/version.txt 2>/dev/null | tr -d ' \r\n'); [ -n "$V" ] || V="1.0.0"
          gh release create latest $files --title "Echo $V" --notes "$notes"
      - name: Tell echoclip.link about the release
        # secret RELEASE_KEY (same value as the Worker secret); not set -> skipped (the server then asks GitHub)
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          [ -n "$RELEASE_KEY" ] || { echo "RELEASE_KEY not set - skipping"; exit 0; }
          V=$(cat ci/version.txt 2>/dev/null | tr -d ' \r\n'); msg=$(git log -1 --pretty=%s)
          sigs='{}'
          for f in $(find out -type f -name '*.sig'); do sigs=$(jq --arg n "$(basename "$f")" --rawfile s "$f" '. + {($n): $s}' <<<"$sigs"); done
          names=$(find out -type f \( -name 'Echo-Windows-portable.zip' -o -name 'Echo-Setup.exe' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.sig' \) -printf '%f\n' | jq -R . | jq -s .)
          jq -n --arg v "$V" --arg m "$msg" --argjson sigs "$sigs" --argjson files "$names" '{version: $v, notes: $m, sigs: $sigs, files: $files}' > rel.json
          curl -sS -f -X POST -H "Content-Type: application/json" -H "x-release-key: $RELEASE_KEY" --data @rel.json https://echoclip.link/release/push || echo "::warning::Telling echoclip.link failed - it falls back to asking GitHub"
      - name: Announce on Discord
        # #announcements webhook = secret DISCORD_WEBHOOK in this repo; not set -> skipped
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "DISCORD_WEBHOOK not set - skipping"; exit 0; }
          V=$(cat ci/version.txt 2>/dev/null | tr -d ' \r\n'); msg=$(git log -1 --pretty=%s)
          # "#..." = internal build (also hidden in Echo's What's new): no announcement
          case "$msg" in "#"*) echo "internal build - no Discord post"; exit 0 ;; esac
          jq -n --arg v "$V" --arg m "$msg" '{username: "Echo", embeds: [{title: ("Echo " + $v + " is out"), url: "https://echoclip.link/changelog", color: 9133302,
            description: ($m + "\n\nEcho updates itself (or press Check for updates in Settings). New here? https://echoclip.link")}]}' > discord.json
          curl -sS -f -X POST -H "Content-Type: application/json" --data @discord.json "$DISCORD_WEBHOOK" || echo "::warning::Discord post failed"
