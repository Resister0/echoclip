name: Build Echo
on:
  # chat 27: a push to main only SAVES the code (sync.cmd / sync.sh, both PCs). A release starts from the
  # "publish-<commit>" tag that publish.cmd pushes (or "Run workflow" here by hand).
  push:
    tags: ['publish-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # chat 27: the Windows / Linux builds + the "latest" release here are GONE. The public repo (Resister0/echoclip,
  # ci/public-build.yml) builds every file people download and every update, and Actions in a public repo are free;
  # here they used $9.67 of the $12 free monthly compute in 5 days (Windows minutes count double) + all of the
  # 0.5 GB storage. This repo now only copies the code over (half a minute on Linux). The old private "latest"
  # release stays as it is; echoclip.link takes the newest of both, so the public one wins.
  public:
    # copies the code (+ ci/public-build.yml as its workflow, + ci/version.txt) (without the private notes, see ci/public-exclude.txt) to the public repo
    # github.com/Resister0/echoclip, one commit per publish. Needs the secret PUBLIC_REPO_TOKEN
    # (fine-grained token, only repo echoclip, Contents: Read and write). Only runs in the private repo.
    if: github.repository == 'Resister0/echo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Copy to the public repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_TOKEN" ]; then echo "PUBLIC_REPO_TOKEN not set - skipping"; exit 0; fi
          msg=$(git log -1 --pretty=%s)
          git clone -q "https://x-access-token:${PUBLIC_TOKEN}@github.com/Resister0/echoclip.git" /tmp/pub
          cd /tmp/pub && git checkout -q -B main && cd -
          # the public copy of the Flatpak metainfo holds the release history (see ci/metainfo-release.py)
          cp /tmp/pub/flatpak/link.echoclip.Echo.metainfo.xml /tmp/old-metainfo.xml 2>/dev/null || true
          rsync -a --delete --exclude-from=ci/public-exclude.txt ./ /tmp/pub/
          cd /tmp/pub
          # last check: never publish something that looks like a key
          if grep -rIlE 'polar_oat_[A-Za-z0-9]|whsec_[A-Za-z0-9]{10}|github_pat_[A-Za-z0-9]{20}|cfut_[A-Za-z0-9]{10}|re_[A-Za-z0-9]{8}_[A-Za-z0-9]{10}|GOCSPX-[A-Za-z0-9_-]{20}|BEGIN [A-Z ]*PRIVATE KEY|IHJzaWduIGVuY3J5cHRlZ[C]BzZWNyZXQga2V5' --exclude-dir=.git . ; then
            echo "Something that looks like a key is in the files above - not publishing"; exit 1
          fi
          # the public repo builds the releases itself: its workflow + the version number of this build
          echo "1.0.${{ github.run_number }}" > ci/version.txt
          # this publish as a <release> in the Flatpak metainfo (Flathub's "What's new"); never stops the publish
          python3 ci/metainfo-release.py flatpak/link.echoclip.Echo.metainfo.xml /tmp/old-metainfo.xml "1.0.${{ github.run_number }}" "$msg" \
            || echo "::warning::Couldn't add the release to the Flatpak metainfo"
          mkdir -p .github/workflows
          cp ci/public-build.yml .github/workflows/build.yml
          git config user.name "Resister0"
          git config user.email "Resister0@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "$msg"
          if git push -q origin HEAD:main; then
            echo "Public repo updated: https://github.com/Resister0/echoclip"
          else
            # the token may not be allowed to change workflows (fine-grained token without "Workflows: Read and write"):
            # publish the code anyway, without the workflow change
            echo "::warning::Couldn't update the public repo's workflow - give the token PUBLIC_REPO_TOKEN 'Workflows: Read and write'"
            git reset -q --soft HEAD~1
            git restore -q --staged .github 2>/dev/null || git reset -q .github
            git checkout -q -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing else changed"; exit 0; fi
            git commit -q -m "$msg"
            git push -q origin HEAD:main
            echo "Public repo updated (code only): https://github.com/Resister0/echoclip"
          fi
