# Brandname hub site: a static-assets-only Worker (no script, no database, no cost on the free plan).
# Deploy (Resister0 only): cd ~/Desktop/Echo/brand-site && npx wrangler deploy   - steps in "Claude outputs/brand-site.md"
name = "brandname-hub"
compatibility_date = "2025-09-01"
workers_dev = true
# uncomment once the domain is bought on Cloudflare (wrangler then creates the DNS record + certificate by itself):
# routes = [
#   { pattern = "brandname.com", custom_domain = true },
#   { pattern = "www.brandname.com", custom_domain = true },
# ]

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"   # about.html is served at /about
not_found_handling = "404-page"         # unknown paths get public/404.html with status 404
