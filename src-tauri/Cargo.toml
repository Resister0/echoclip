[package]
name = "echo"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Resister0/echoclip"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
cpal = "0.15"
# Echo's own HTTPS calls (same crates the auto-updater already brings in; replaces hidden curl.exe)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# unpack downloaded helper zips in-process (no hidden tar.exe - looks dropper-like to antivirus)
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
# the same version wry (Tauri's web view) uses: for web view settings (smooth scrolling)
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# window id = Flatpak app id (taskbar icon); same version Tauri already uses
glib = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation","Win32_Graphics_Direct3D","Win32_Graphics_Direct3D11","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_Graphics_Gdi","Win32_Media_Audio","Win32_System_SystemInformation","Win32_Media_MediaFoundation","Win32_System_Com","Win32_System_Pipes","Win32_System_IO","Win32_Storage_FileSystem","Win32_Security","Win32_Security_Cryptography","Win32_System_Threading","Win32_System_Variant","Win32_System_Ole","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Input_XboxController","Win32_UI_Shell","Win32_UI_Shell_Common","Win32_System_DataExchange","Win32_System_Memory","Win32_System_Registry","Win32_System_Diagnostics_ToolHelp","Win32_Graphics_Direct3D_Fxc","Win32_Devices_Display","Win32_System_WinRT","Win32_System_WinRT_Direct3D11","Win32_System_WinRT_Graphics_Capture","Graphics_Capture","Graphics_DirectX","Graphics_DirectX_Direct3D11","Graphics","Foundation"] }
wasapi = "0.19"
# same versions Tauri already uses (to switch off the WebView's own Ctrl+F etc.)
webview2-com = "0.39"
wincore62 = { package = "windows-core", version = "0.62" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = "s"
strip = true
