<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo popup</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; }
  body { display:flex; align-items:flex-start; justify-content:flex-end; padding:10px; box-sizing:border-box;
         font:14px/1.3 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; color:#f5f5f7; }
  .t { display:flex; align-items:center; gap:12px; min-width:220px; max-width:330px; padding:12px 16px 12px 12px;
       background:#141418f2; border:1px solid #ffffff1c; border-radius:14px; box-shadow:0 8px 28px #0009;
       transform:translateX(30px); opacity:0; transition:transform .25s cubic-bezier(.2,.9,.3,1.2), opacity .2s; }
  .t.on { transform:none; opacity:1; }
  .ic { width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center;
        background:linear-gradient(135deg,#8b6cff,#4f7bff); }
  .t.bad .ic { background:#fb5c7c; }
  .ic svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  b { display:block; font-weight:600; font-size:14px; }
  small { display:block; color:#a0a0ab; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
</style>
</head>
<body>
<div class="t" id="t"><div class="ic" id="ic"></div><div><b id="ti"></b><small id="su"></small></div></div>
<script>
  const OK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const BAD = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  let h;
  window.show = (title, sub, ok) => {
    const t = document.getElementById("t");
    document.getElementById("ti").textContent = title;
    document.getElementById("su").textContent = sub || "";
    document.getElementById("ic").innerHTML = ok ? OK : BAD;
    t.classList.toggle("bad", !ok);
    // same colours as the theme picked in Echo (Settings > Appearance)
    try { const g = JSON.parse(localStorage.getItem("echo_theme") || "null"); document.getElementById("ic").style.background = ok && g && g.grad ? g.grad : ""; } catch (e) {}
    t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
    clearTimeout(h); h = setTimeout(() => t.classList.remove("on"), 2300);
  };
</script>
</body>
</html>
