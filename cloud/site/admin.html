<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Echo stats</title>
<style>
  :root { --bg:#0e0f12; --card:#16181d; --line:#262a31; --text:#eceef2; --muted:#9097a3; --faint:#5e6570; --good:#3fb27f; --bad:#e5534b; --accent:#8b7cf6; color-scheme:dark; }
  @media (prefers-color-scheme: light) { :root { color-scheme:light; --bg:#f6f7f9; --card:#fff; --line:#e3e6eb; --text:#16181d; --muted:#5b6270; --faint:#8a919c; --good:#1f8a5b; --bad:#c93a32; --accent:#6d5ce8; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0; } h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 10px; font-weight:600; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; } .top .sp { flex:1; }
  .sub { color:var(--muted); font-size:13px; }
  button, input, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
  button { cursor:pointer; } button:hover { border-color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .tile .k { color:var(--muted); font-size:12.5px; } .tile .v { font-size:26px; font-weight:650; margin-top:4px; font-variant-numeric:tabular-nums; }
  .tile .s { color:var(--faint); font-size:12px; margin-top:2px; }
  .hero { grid-column:span 2; } .hero .v { font-size:32px; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; margin-left:6px; vertical-align:middle; }
  .pill.good { color:var(--good); background:color-mix(in srgb,var(--good) 14%,transparent); }
  .pill.bad { color:var(--bad); background:color-mix(in srgb,var(--bad) 14%,transparent); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; } tr:last-child td { border-bottom:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .wrap { overflow-x:auto; border-radius:12px; scrollbar-width:thin; scrollbar-color:var(--faint) transparent; }
  .bar { height:6px; border-radius:3px; background:var(--line); width:90px; display:inline-block; vertical-align:middle; margin-left:8px; }
  .bar i { display:block; height:100%; border-radius:3px; background:var(--accent); }
  .bar i.full { background:var(--bad); }
  .login { max-width:420px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .login input { width:100%; margin:12px 0; }
  textarea { resize:vertical; line-height:1.4; }
  details.sec > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; }
  details.sec > summary::-webkit-details-marker { display:none; }
  details.sec > summary h2 { margin:0; } details.sec > summary::after { content:"▸"; color:var(--muted); }
  details.sec[open] > summary::after { content:"▾"; } details.sec { margin:28px 0 8px; }
  .err { color:var(--bad); margin-top:8px; } .note { color:var(--faint); font-size:12px; margin-top:24px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .two > * { min-width:0; } @media (max-width:720px) { .two { grid-template-columns:1fr; } }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px 8px; margin-top:10px; }
  .chart svg { width:100%; height:150px; display:block; } .chart .lg { color:var(--muted); font-size:12px; display:flex; gap:14px; margin-bottom:6px; }
  .chart .lg i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .chart .ax { display:flex; justify-content:space-between; color:var(--faint); font-size:11px; margin-top:4px; }
  @media (max-width:520px) { .hero { grid-column:span 1; } }
  .tabs { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin:14px -16px 0; padding:6px 16px 0; border-bottom:1px solid var(--line); }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs a { color:var(--muted); text-decoration:none; font-weight:600; font-size:13.5px; padding:9px 12px 10px; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a:hover { color:var(--text); } .tabs a.on { color:var(--text); border-bottom-color:var(--accent); }
  .tabs .cnt { display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:99px; font-size:11px; line-height:18px; text-align:center; color:#fff; background:var(--bad); }
  .tabs .cnt[hidden] { display:none; }
  .tab > h2:first-child, .tab > details.sec:first-child, .tab > div:first-child > h2:first-child { margin-top:22px; }

  /* charts (18 Nov 2026) - series colours checked for colour-blind safety on these surfaces (dark #16181d / light #fff) */
  :root { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#23262c; --axis:#3a3f48; --up:#3fb27f; --down:#e5534b; }
  @media (prefers-color-scheme: light) { :root { --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --grid:#eef0f3; --axis:#cfd3da; --up:#1f8a5b; --down:#c93a32; } }
  .s1 { background:var(--s1); } .s2 { background:var(--s2); } .s3 { background:var(--s3); } .s4 { background:var(--s4); } .s5 { background:var(--s5); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px 10px; min-width:0; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:10px; margin-top:10px; }
  @media (max-width:520px) { .charts { grid-template-columns:1fr; } }
  .cc-h { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .cc-t { font-weight:600; font-size:14px; }
  .cc-lg { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
  .cc-lg i, .tt-r i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .cc-plot { position:relative; margin-left:34px; border-bottom:1px solid var(--axis); }
  .cc-g { position:absolute; left:0; right:0; border-top:1px solid var(--grid); }
  .cc-g span { position:absolute; right:calc(100% + 8px); top:-8px; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cc-g:first-child { border-top:0; }
  .cc-cols { position:absolute; inset:0; display:flex; }
  .cc-col { flex:1; position:relative; display:flex; justify-content:center; align-items:flex-end; outline:none; cursor:default; border-radius:4px; }
  .cc-col:hover, .cc-col:focus-visible { background:color-mix(in srgb,var(--text) 5%,transparent); }
  .cc-stk { width:min(24px,62%); height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; }
  .cc-stk i { display:block; min-height:2px; }
  .cc-stk i:first-child { border-radius:4px 4px 0 0; }
  .cc-val { position:absolute; left:50%; transform:translate(-50%,-4px); font-size:12px; font-weight:650; color:var(--text); white-space:nowrap; }
  .cc-x { position:relative; height:20px; margin-left:34px; }
  .cc-x span { position:absolute; top:5px; transform:translateX(-50%); font-size:11px; color:var(--faint); white-space:nowrap; }
  #cctip { position:fixed; z-index:20; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12.5px; box-shadow:0 6px 24px rgba(0,0,0,.25); min-width:130px; }
  #cctip .tt-h { color:var(--muted); font-size:12px; margin-bottom:4px; }
  .tt-r { display:flex; align-items:center; gap:0; line-height:1.7; } .tt-r b { min-width:34px; margin-right:8px; font-variant-numeric:tabular-nums; } .tt-r span { color:var(--muted); }
  .tt-r i { width:10px; height:3px; border-radius:2px; vertical-align:middle; } .tt-t { border-top:1px solid var(--line); margin-top:3px; padding-top:2px; }
  .hb-r { display:grid; grid-template-columns:minmax(120px,38%) 1fr; gap:12px; align-items:center; padding:5px 0; font-size:13px; }
  .hb-k { min-width:0; } .hb-n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hb-k .sub { font-size:11.5px; margin:0 !important; }
  .hb-t { display:flex; align-items:center; gap:8px; } .hb-t i { display:block; height:12px; border-radius:0 4px 4px 0; } .hb-t b { font-weight:600; font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hb .cc-t { margin-bottom:2px; } .hb .sub { margin-bottom:8px; }
  .tile { position:relative; overflow:hidden; } .tile .v { font-variant-numeric:normal; }
  .spark { display:block; width:100%; height:28px; margin-top:8px; }
  .spark path { fill:none; stroke:var(--s1); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; opacity:.9; }
  .dl { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:2px; } .dl.up { color:var(--up); } .dl.down { color:var(--down); }
  .zero td { color:var(--faint); }
  .mini { display:inline-block; height:6px; border-radius:3px; background:var(--s1); vertical-align:middle; margin-left:8px; opacity:.85; }

  /* whole-page pass (18 Nov 2026) */
  h3 { font-size:13px; font-weight:600; margin:18px 0 8px; color:var(--text); }
  th { cursor:pointer; user-select:none; } th:hover { color:var(--text); }
  th[data-sort="desc"]::after { content:" ↓"; } th[data-sort="asc"]::after { content:" ↑"; }
  #rels th { cursor:default; }
  .keys { font-size:12px; color:var(--faint); } @media (max-width:640px) { .keys { display:none; } }
  .seg { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .seg button { padding:5px 11px; font-size:13px; } .seg button[aria-pressed="true"] { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,var(--card)); }
  details.about { margin:8px 0 12px; } details.about > summary { cursor:pointer; color:var(--muted); font-size:13px; list-style:none; }
  details.about > summary::before { content:"ⓘ "; } details.about[open] > summary { margin-bottom:6px; }
  details.about.note { margin-top:28px; font-size:12px; color:var(--faint); }
  details.more { margin-top:8px; } details.more > summary { cursor:pointer; color:var(--muted); font-size:13px; padding:6px 0; }
  .atts { padding:4px 6px; display:flex; flex-direction:column; }
  .att { display:grid; grid-template-columns:22px 70px 1fr 14px; gap:8px; align-items:center; padding:9px 10px; border-radius:8px; color:var(--text); text-decoration:none; font-size:13.5px; }
  .att + .att { border-top:1px solid var(--line); border-radius:0; }
  a.att:hover { background:color-mix(in srgb,var(--text) 5%,transparent); }
  .att-i { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; }
  .att-w { font-size:12px; font-weight:650; color:var(--muted); } .att-go { color:var(--faint); }
  .att.critical .att-i { background:#d03b3b; } .att.serious .att-i { background:#ec835a; } .att.warning .att-i { background:#fab219; color:#0b0b0b; }
  .att.info .att-i { background:var(--faint); } .att.good .att-i { background:#0ca30c; }
  .att[hidden] { display:none; }
  .funnel { display:flex; align-items:stretch; gap:6px; flex-wrap:wrap; }
  .fn-s { flex:1; min-width:140px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .fn-s .k { color:var(--muted); font-size:12.5px; } .fn-s .v { font-size:26px; font-weight:650; margin:2px 0; }
  .fn-c { display:block; font-size:12px; color:var(--faint); }
  .fn-a { align-self:center; color:var(--faint); font-size:18px; } @media (max-width:640px) { .fn-a { display:none; } }
</style>
</head>
<body>
<main id="app"></main>
<script src="/admin.js"></script>
</body>
</html>
