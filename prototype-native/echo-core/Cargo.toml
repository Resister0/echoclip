[package]
name = "echo-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Echo's real backend (recorder, settings, hotkeys, cloud) for the native app: the files in ../../src-tauri/src are compiled UNCHANGED (one source of truth, no copies)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
cpal = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
ring = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation","Win32_Graphics_Direct3D","Win32_Graphics_Direct3D11","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_Graphics_Gdi","Win32_Media_Audio","Win32_System_SystemInformation","Win32_System_JobObjects","Win32_Media_MediaFoundation","Win32_System_Com","Win32_System_Pipes","Win32_System_IO","Win32_Storage_FileSystem","Win32_Security","Win32_Security_Cryptography","Win32_System_Threading","Win32_System_Variant","Win32_System_Ole","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Input_XboxController","Win32_UI_Shell","Win32_UI_Shell_Common","Win32_System_DataExchange","Win32_System_Memory","Win32_System_Registry","Win32_System_Diagnostics_ToolHelp","Win32_Graphics_Direct3D_Fxc","Win32_Devices_Display","Win32_System_WinRT","Win32_System_WinRT_Direct3D11","Win32_System_WinRT_Graphics_Capture","Graphics_Capture","Graphics_DirectX","Graphics_DirectX_Direct3D11","Graphics","Foundation"] }
wasapi = "0.19"
